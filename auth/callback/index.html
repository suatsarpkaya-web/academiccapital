<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Hesap doğrulanıyor — AkademikKapital</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f5f6f8; color: #1f2937; font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 30rem; padding: 2rem; border: 1px solid #e5e7eb; border-radius: 1rem; background: white; text-align: center; box-shadow: 0 12px 32px #142c4912; }
    h1 { margin: 0 0 .5rem; font-size: 1.25rem; }
    p { margin: 0; color: #596579; }
  </style>
</head>
<body>
  <main aria-live="polite">
    <h1 id="status">E-posta bağlantısı doğrulanıyor</h1>
    <p id="message">Lütfen bu pencereyi kapatmayın.</p>
  </main>
  <script type="module">
    const status = document.querySelector('#status');
    const message = document.querySelector('#message');
    try {
      const response = await fetch('/api/config', { cache: 'no-store' });
      if (!response.ok) throw new Error('config');
      const { url, key } = await response.json();
      const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
      const client = createClient(url, key, {
        auth: { storage: window.sessionStorage, persistSession: true, autoRefreshToken: true, detectSessionInUrl: false }
      });
      const code = new URLSearchParams(window.location.search).get('code');
      if (code) {
        const { error } = await client.auth.exchangeCodeForSession(code);
        if (error) throw error;
      }
      window.location.replace('/');
    } catch {
      status.textContent = 'Bağlantı doğrulanamadı';
      message.textContent = 'E-posta bağlantısını yeniden açın veya ana sayfaya dönüp giriş yapın.';
    }
  </script>
</body>
</html>
